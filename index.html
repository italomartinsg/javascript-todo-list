<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>To-Do List</title>
  <link rel="stylesheet" href="./css/style.css">
</head>

<body>
  <div class="container">
    <form>
      <h1>To-Do List</h1>
      <label for="texto">Adicionar Tarefa:</label>
      <div class="task-form-row">
        <input type=" text" class="texto" id="texto">
        <button type="submit" id="btn-add">Adicionar</button>
      </div>

    </form>
    <div class="btns">
      <button type="button" data-filter="all" class="active">Todas Tarefas</button>
      <button type="button" data-filter="pending">Tarefas Pendentes</button>
      <button type="button" data-filter="completed">Tarefas Concluídas</button>
    </div>
    <p class="task-counter"></p>
    <ul class="task-list">
    </ul>

  </div>

  <script src="js/script.js"></script>
</body>

</html>
